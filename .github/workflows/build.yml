name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Morphe Gradle plugin resolves from GitHub Packages, which needs
      # an authenticated request. If the workflow token cannot read the
      # MorpheApp registry, add a PAT with `read:packages` as MORPHE_TOKEN.
      - name: Build patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:build :patches:generatePatchesList --no-daemon

      - name: List built bundles
        run: ls -la patches/build/libs/

      - name: Update patches-bundle.json and patches-list.json
        run: |
          VERSION=$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" << 'EOF'
          import json, sys, datetime
          version = sys.argv[1]
          with open('patches-bundle.json') as f:
              bundle = json.load(f)
          bundle['version'] = version
          bundle['created_at'] = datetime.datetime.now().strftime('%Y-%m-%dT%H:%M:%S')
          bundle['description'] = 'Liquid Glass navigation for Strava (floating glass pill, Extra Settings tweaks) on top of madushas 0.7.0.'
          bundle['download_url'] = f'https://github.com/mwbra130/morphe-patches-custom/releases/download/v{version}/patches-{version}.mpp'
          with open('patches-bundle.json', 'w') as f:
              json.dump(bundle, f, indent=1)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git diff --cached --quiet || git commit -m "chore: update bundle metadata for v$VERSION [skip ci]"
          git push

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Morphe Patches v${{ env.VERSION }} (Liquid Glass)
          body: |
            Fork of madushas/morphe-patches-custom v0.7.0 plus one addition:
            **Liquid Glass navigation** for Strava 486.9 — floating glass bottom
            pill with a live blurred backdrop, tweaks in Extra Settings
            (master switch, floating vs docked, blur on/off, tint opacity).
          files: patches/build/libs/patches-${{ env.VERSION }}.mpp
